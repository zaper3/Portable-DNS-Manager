name: Assemble verified v1.0.0 sources

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble, validate and clean staging
        shell: bash
        run: |
          set -euo pipefail
          test -f .assembly/READY
          mkdir -p windows linux

          {
            cat .assembly/windows.000.b64
            cat .assembly/windows.001.b64
            cat .assembly/windows.002.b64
            cat .assembly/windows.003h*.hex | xxd -r -p
            for f in .assembly/windows.{004..010}.b64; do cat "$f"; done
          } > /tmp/windows.gz.b64

          tr -d '\r\n' < /tmp/windows.gz.b64 | base64 -d | gzip -dc > windows/Portable_DNS_Manager.bat
          cat .assembly/linux.*.b64 | tr -d '\r\n' | base64 -d | gzip -dc > linux/portable-dns-manager.sh
          chmod +x linux/portable-dns-manager.sh

          echo "25852f3d130749692b72651b739afadfc99b73dca2945ccf5aa5682c17b09fa9  windows/Portable_DNS_Manager.bat" | sha256sum -c -
          echo "1a1aeffc1fb2833af2e9bc1369b39aa54d4c522c3cd036bb66d9eaf2fd8abd99  linux/portable-dns-manager.sh" | sha256sum -c -
          bash -n linux/portable-dns-manager.sh

          test "$(grep -c '^###__POWERSHELL_PAYLOAD__###$' windows/Portable_DNS_Manager.bat)" -eq 1
          ! grep -Eiq 'v1\.0\.0-rc|TEST BUILD|VERSI.N DE PRUEBA|test candidate' windows/Portable_DNS_Manager.bat

          rm -rf .assembly .source-parts .build
          rm -f .github/workflows/assemble-source.yml

      - name: Commit verified sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add verified Windows and Linux v1.0.0 sources"
          git push
