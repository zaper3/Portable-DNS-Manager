name: Assemble v1.0.0 source files

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble and verify source files
        shell: bash
        run: |
          set -euo pipefail
          test -f .source-parts/READY
          mkdir -p windows linux

          cat .source-parts/windows.*.gz.b64 | tr -d '\r\n' | base64 -d | gzip -dc > windows/Portable_DNS_Manager.bat
          cat .source-parts/linux.*.gz.b64   | tr -d '\r\n' | base64 -d | gzip -dc > linux/portable-dns-manager.sh
          chmod +x linux/portable-dns-manager.sh

          echo "25852f3d130749692b72651b739afadfc99b73dca2945ccf5aa5682c17b09fa9  windows/Portable_DNS_Manager.bat" | sha256sum -c -
          echo "1a1aeffc1fb2833af2e9bc1369b39aa54d4c522c3cd036bb66d9eaf2fd8abd99  linux/portable-dns-manager.sh" | sha256sum -c -

          rm -rf .source-parts .build

      - name: Commit verified source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add verified Windows and Linux v1.0.0 sources"
          git push
