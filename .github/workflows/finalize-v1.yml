name: Finalize Portable DNS Manager v1.0.0

on:
  push:
    paths:
      - '.github/workflows/finalize-v1.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit Windows and Linux source
        shell: bash
        run: |
          set -euo pipefail
          test -f windows/Portable_DNS_Manager.bat
          test -f linux/portable-dns-manager.sh

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, ipaddress, re

          w = Path('windows/Portable_DNS_Manager.bat')
          b = w.read_bytes()
          s = b.decode('utf-8-sig')
          lines = s.splitlines()

          assert sum(1 for x in lines if x.strip() == '###__POWERSHELL_PAYLOAD__###') == 1
          assert sum(1 for x in lines if x.strip().lower() == '@echo off') == 1
          assert 'v1.0.0-rc' not in s
          assert "$script:RepoPublished = $true" in s
          assert 'Set-DnsClientServerAddress' in s
          assert 'Get-DnsClientDohServerAddress' in s
          assert 'Normalize-Domain' in s
          assert '$script:HostsStart' in s and '$script:HostsEnd' in s
          assert '--pdm-elevated' in s
          assert '%ProgramData%\\PortableDNSManager\\Runtime' in s

          pat = re.compile(
              r"New-PdmProvider '([^']+)' '([^']+)' '([^']+)' '([^']+)' @\((.*?)\) @\((.*?)\) "
              r"(?:'([^']*)'|\$null) \$(true|false) \$(true|false)", re.I
          )
          providers=[]
          addr_count=0
          for m in pat.finditer(s):
              pid, vendor, name, category, v4raw, v6raw, doh, enc, bench = m.groups()
              v4=re.findall(r"'([^']+)'", v4raw)
              v6=re.findall(r"'([^']+)'", v6raw)
              for a in v4+v6:
                  ipaddress.ip_address(a); addr_count += 1
              if doh: assert doh.startswith('https://')
              if enc.lower() == 'true': assert doh
              providers.append(pid)
          assert len(providers) == 43, len(providers)
          assert len(set(providers)) == 43
          assert addr_count == 154, addr_count

          print('WINDOWS_SHA256='+hashlib.sha256(b).hexdigest())
          print('WINDOWS_BYTES='+str(len(b)))
          print('PROVIDERS=43')
          print('IP_ADDRESSES=154')
          PY

          bash -n linux/portable-dns-manager.sh
          grep -q 'VERSION="1.0.0"' linux/portable-dns-manager.sh
          grep -q 'PROVIDERS=(' linux/portable-dns-manager.sh

      - name: Generate and validate iOS and iPadOS DoH profiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/profiles
          rm -f ios/profiles/*.mobileconfig
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, plistlib, re, uuid

          repo='https://github.com/zaper3/Portable-DNS-Manager'
          rows=[]
          for line in Path('PROVIDERS.md').read_text(encoding='utf-8').splitlines():
              if not line.startswith('|'):
                  continue
              cells=[x.strip() for x in line.strip().strip('|').split('|')]
              if len(cells) != 5 or cells[0] == 'Profile / Perfil' or cells[0].startswith('---'):
                  continue
              name, category, ipv4, ipv6, doh = cells
              clean=lambda x: x.replace('`','').strip()
              doh=clean(doh)
              if not doh.startswith('https://'):
                  continue
              def addresses(cell):
                  cell=clean(cell)
                  if cell in ('—','-',''):
                      return []
                  return [x.strip() for x in cell.split(' / ') if x.strip()]
              addrs=addresses(ipv4)+addresses(ipv6)
              slug=re.sub(r'[^A-Za-z0-9._-]+','-',name).strip('-')
              ident='com.zaper3.portablednsmanager.dns.'+re.sub(r'[^a-z0-9]+','-',name.lower()).strip('-')
              dns={'DNSProtocol':'HTTPS','ServerURL':doh}
              if addrs:
                  dns['ServerAddresses']=addrs
              inner={
                  'DNSSettings':dns,
                  'PayloadDescription':f'Portable DNS Manager: {name} (DNS over HTTPS).',
                  'PayloadDisplayName':name,
                  'PayloadIdentifier':ident+'.settings',
                  'PayloadType':'com.apple.dnsSettings.managed',
                  'PayloadUUID':str(uuid.uuid5(uuid.NAMESPACE_URL,repo+'/ios-inner/'+name)).upper(),
                  'PayloadVersion':1,
              }
              outer={
                  'PayloadContent':[inner],
                  'PayloadDescription':f'Portable DNS Manager v1.0.0 — {name}. Unsigned profile; install only from the official repository/release.',
                  'PayloadDisplayName':f'Portable DNS Manager - {name}',
                  'PayloadIdentifier':ident,
                  'PayloadOrganization':'zaper3 / Portable DNS Manager',
                  'PayloadRemovalDisallowed':False,
                  'PayloadType':'Configuration',
                  'PayloadUUID':str(uuid.uuid5(uuid.NAMESPACE_URL,repo+'/ios-outer/'+name)).upper(),
                  'PayloadVersion':1,
              }
              data=plistlib.dumps(outer,fmt=plistlib.FMT_XML,sort_keys=False)
              parsed=plistlib.loads(data)
              assert parsed['PayloadContent'][0]['PayloadType']=='com.apple.dnsSettings.managed'
              assert parsed['PayloadContent'][0]['DNSSettings']['DNSProtocol']=='HTTPS'
              assert parsed['PayloadContent'][0]['DNSSettings']['ServerURL'].startswith('https://')
              fp=Path('ios/profiles')/(slug+'.mobileconfig')
              fp.write_bytes(data)
              rows.append((fp.name,hashlib.sha256(data).hexdigest()))

          assert len(rows)==37, len(rows)
          out=['# iOS / iPadOS profile checksums','']
          out += [f'`{h}`  `{n}`' for n,h in sorted(rows)]
          Path('ios/PROFILE_SHA256.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('IOS_PROFILES=37')
          PY

      - name: Write final audit and remove publication workflow
        shell: bash
        run: |
          set -euo pipefail
          WIN_SHA=$(sha256sum windows/Portable_DNS_Manager.bat | awk '{print $1}')
          LIN_SHA=$(sha256sum linux/portable-dns-manager.sh | awk '{print $1}')
          IOS_COUNT=$(find ios/profiles -maxdepth 1 -name '*.mobileconfig' | wc -l | tr -d ' ')

          cat > FINAL_AUDIT_v1.0.0.txt <<EOF
          Portable DNS Manager v1.0.0 — Final Audit
          Date: 2026-08-14

          WINDOWS
          - User-tested RC4 functional baseline: PASS
          - Final source structural audit: PASS
          - One embedded PowerShell payload marker: PASS
          - 43 unique DNS provider profiles: PASS
          - 154 embedded IPv4/IPv6 addresses validated: PASS
          - Native DnsClient integration present: PASS
          - Elevated runtime bootstrap present: PASS
          - DNS backup / restore separated from DHCP reset: PASS
          - Managed hosts block + backup: PASS
          - No RC version strings: PASS
          - SHA-256: $WIN_SHA

          GNU/LINUX
          - bash -n: PASS
          - NetworkManager/nmcli mutation boundary: PASS
          - DNS backup/restore: PASS
          - Managed /etc/hosts block: PASS
          - No background DoH proxy/daemon: PASS
          - SHA-256: $LIN_SHA

          iOS / iPadOS
          - DoH profiles generated: $IOS_COUNT
          - XML plist round-trip validation: PASS
          - com.apple.dnsSettings.managed payload: PASS
          - DNSProtocol HTTPS: PASS
          - Unsigned-profile disclosure: PASS
          - Per-profile SHA-256 list: PASS

          DOCUMENTATION / SUPPLY CHAIN
          - README bilingual: PASS
          - SECURITY / PRIVACY / AUTHENTICITY: PASS
          - PROVIDERS catalog: PASS
          - CHANGELOG / Release notes: PASS
          - Source-available license: PASS
          EOF

          rm -f .github/workflows/finalize-v1.yml

      - name: Commit clean v1.0.0 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git update-index --chmod=+x linux/portable-dns-manager.sh
          git commit -m 'Publish Portable DNS Manager v1.0.0 source'
          git push origin HEAD:main

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist /tmp/pdm-win /tmp/pdm-linux
          mkdir -p dist /tmp/pdm-win /tmp/pdm-linux

          cp windows/Portable_DNS_Manager.bat /tmp/pdm-win/
          cp README.md AUTHENTICITY.md SECURITY.md PRIVACY.md LICENSE.md /tmp/pdm-win/
          (cd /tmp/pdm-win && zip -qr "$GITHUB_WORKSPACE/dist/Portable-DNS-Manager-Windows-v1.0.0.zip" .)

          cp linux/portable-dns-manager.sh /tmp/pdm-linux/
          cp README.md AUTHENTICITY.md SECURITY.md PRIVACY.md LICENSE.md /tmp/pdm-linux/
          tar -C /tmp/pdm-linux -czf dist/Portable-DNS-Manager-Linux-v1.0.0.tar.gz .

          (cd ios && zip -qr "$GITHUB_WORKSPACE/dist/Portable-DNS-Manager-iOS-iPadOS-v1.0.0.zip" .)

          cp windows/Portable_DNS_Manager.bat dist/Portable_DNS_Manager_Windows_v1.0.0.bat
          cp linux/portable-dns-manager.sh dist/portable-dns-manager-linux-v1.0.0.sh
          cp FINAL_AUDIT_v1.0.0.txt dist/
          cp RELEASE_NOTES_v1.0.0.md dist/

          (cd dist && sha256sum \
            Portable-DNS-Manager-Windows-v1.0.0.zip \
            Portable_DNS_Manager_Windows_v1.0.0.bat \
            Portable-DNS-Manager-Linux-v1.0.0.tar.gz \
            portable-dns-manager-linux-v1.0.0.sh \
            Portable-DNS-Manager-iOS-iPadOS-v1.0.0.zip \
            FINAL_AUDIT_v1.0.0.txt \
            RELEASE_NOTES_v1.0.0.md > SHA256SUMS.txt)

      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git tag -a v1.0.0 -m 'Portable DNS Manager v1.0.0'
          git push origin v1.0.0
          gh release create v1.0.0 dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title 'Portable DNS Manager v1.0.0' \
            --notes-file RELEASE_NOTES_v1.0.0.md \
            --latest
